<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emberwild: Survival</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/planck.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/p5play.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #101923;
        color: #f5f0d8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 18px;
        box-sizing: border-box;
        text-align: center;
      }

      a {
        color: #f6cc73;
      }

      h1 {
        margin: 8px 0;
        color: #ffd879;
      }

      p {
        margin: 8px auto 14px;
        max-width: 960px;
        line-height: 1.5;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
        margin: 0 auto;
        border: 3px solid #e8c879;
        border-radius: 8px;
        box-shadow: 0 12px 36px #0008;
      }

      .home-link {
        display: inline-block;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Emberwild: Survival</h1>
    <p>
      Arrows move · Space jumps · 1 axe · 2 pickaxe · 3 sword · Q changes
      block · Left-click uses your tool · Right-click places a block
    </p>
    <script src="fantasy_survival.js"></script>
    <a class="home-link" href="index.html">Back to home</a>
  </body>
</html>
