<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starfall Run</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/planck.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/p5play.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #070b18;
        color: #eaf7ff;
      }

      body {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px;
        text-align: center;
      }

      h1 {
        margin: 4px 0 8px;
        color: #5cf2ff;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      p {
        margin: 8px auto;
        line-height: 1.5;
      }

      .game-panel {
        max-width: 960px;
        margin: 20px auto;
        padding: 14px;
        border: 1px solid #28556d;
        border-radius: 12px;
        background: #0c1425;
        box-shadow: 0 12px 40px #0008;
      }

      #game-status {
        min-height: 24px;
        color: #f7d96b;
        font-weight: bold;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
        margin: 12px auto;
        border: 2px solid #3ddbea;
        border-radius: 6px;
      }

      button,
      a {
        color: #5cf2ff;
      }

      button {
        padding: 10px 18px;
        border: 1px solid #5cf2ff;
        border-radius: 6px;
        background: #102b3a;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #17475a;
      }

      .home-link {
        display: inline-block;
        margin: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Starfall Run</h1>
    <p>Space: start and jump · R: restart · Avoid every neon hazard and reach the portal.</p>
    <main class="game-panel">
      <div id="game-status" aria-live="polite">Loading mission...</div>
      <div id="game"></div>
      <button id="action-button" type="button">Start mission</button>
    </main>
    <a class="home-link" href="index.html">Back to homepage and level select</a>
    <script src="starfall_runner.js"></script>
  </body>
</html>
